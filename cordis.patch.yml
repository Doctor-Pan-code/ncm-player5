# ncm-player5 bundle patch：向组合挂载自身（Node half + client half）
# ncm-player5 = ncm-player4 1.3.1 的全部功能：
#   + 点击播放窗口外自动收起为迷你条
#   + 迷你条无操作 3 秒自动退出为右下角音符按钮
#   + 右下角音符按钮「随音乐节奏跳动」（Web Audio 低频能量驱动）
#   + 右下角音符按钮支持左键长按拖动（位置持久化）
#   + 唯一新增：检测到因下架/无版权而无法播放的歌曲时自动跳过，播放下一首
#
# 注意：与 ncm-player2/3/4 不能同时启用——host 半部都注册 /ncm/api 前缀路由，
# 同时启用会互相抢占。启用本插件时请在 profile 的 cordis.patch.yml 里
# 给 ncm-player4 加 `disabled: true`。
- insert:
    - id: ncm-player5
      name: '@doctor-pan-code/ncm-player5'
